{% extends "base.html" %}
{% block title %}Admin Login | GATE Intelligence{% endblock %}
{% block content %}
<div class="gi-auth-shell">
  <div class="gi-card p-4 p-md-5 border-top border-4" style="border-top-color: var(--gi-navy) !important;">
    <span class="badge bg-dark mb-2">Restricted Access</span>
    <h3 class="fw-bold mb-1" style="color: var(--gi-navy);">Administrator Portal</h3>
    <p class="text-muted small mb-4">Manage GATE branches, official syllabi, question-paper ingestion, and verification.</p>
    <form method="post" action="{{ url_for('auth.admin_login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-medium" for="email">Admin Email</label>
        <input class="form-control" id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label fw-medium" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required>
      </div>
      <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">Sign In to Admin Console</button>
    </form>
    <div class="mt-3 text-center small">
      <a href="{{ url_for('auth.login') }}">Student Login</a>
    </div>
  </div>
</div>
{% endblock %}
