{% extends "base.html" %}
{% block title %}Student Login | GATE Intelligence{% endblock %}
{% block content %}
<div class="gi-auth-shell">
  <div class="gi-card p-4 p-md-5">
    <h3 class="fw-bold mb-1" style="color: var(--gi-navy);">Student Sign In</h3>
    <p class="text-muted small mb-4">Access your GATE assessments, syllabus navigator, and performance workspace.</p>
    <form method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label fw-medium" for="email">Email Address</label>
        <input class="form-control" id="email" name="email" type="email" value="{{ email or '' }}" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label fw-medium" for="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" required>
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="remember" name="remember">
        <label class="form-check-label small" for="remember">Keep me signed in</label>
      </div>
      <button type="submit" class="btn btn-gi-primary w-100 py-2 fw-semibold">Sign In</button>
    </form>
    <hr class="my-4">
    <div class="d-flex justify-content-between small">
      <a href="{{ url_for('auth.register') }}">New student? Register</a>
      <a href="{{ url_for('auth.admin_login') }}">Administrator Portal</a>
    </div>
  </div>
</div>
{% endblock %}
