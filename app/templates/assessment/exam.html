<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{{ attempt.test.title }} | GATE Exam Interface</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
  <style>
    body { background: #f3f6fb; }
    .exam-topbar { background: #0f2447; color: #fff; }
    .palette-btn { width: 42px; height: 38px; font-weight: 600; font-size: 0.85rem; border-radius: 0.4rem; border: 1px solid #cbd5e1; }
    .st-not_visited { background: #f8fafc; color: #334155; }
    .st-visited_unanswered { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
    .st-answered { background: #dcfce7; color: #166534; border-color: #86efac; }
    .st-marked_for_review { background: #ede9fe; color: #5b21b6; border-color: #c4b5fd; }
    .st-answered_and_marked { background: #dbeafe; color: #1e40af; border-color: #93c5fd; box-shadow: inset 0 -3px 0 #16a34a; }
    .palette-btn.current { outline: 2px solid #0f2447; outline-offset: 1px; }
    .option-card { border: 1px solid #dce3ee; border-radius: 0.5rem; padding: 0.75rem 1rem; cursor: pointer; transition: background 0.15s; }
    .option-card:hover { background: #f1f5fb; }
  </style>
</head>
<body>
  <header class="exam-topbar py-2 px-3 px-lg-4 d-flex flex-wrap justify-content-between align-items-center gap-2 sticky-top">
    <div>
      <div class="fw-semibold">{{ attempt.test.title }}</div>
      <div class="small text-light opacity-75">Candidate: {{ current_user.full_name }}</div>
    </div>
    <div class="d-flex align-items-center gap-3">
      <div id="saveStatus" class="small text-light opacity-75">Synced</div>
      <div class="bg-white text-dark px-3 py-1 rounded fw-bold font-monospace fs-5" id="timerDisplay">--:--:--</div>
      <button type="button" class="btn btn-danger btn-sm fw-semibold" id="openSubmitModalBtn">Submit Test</button>
    </div>
  </header>

  <main class="container-fluid py-3 px-3 px-lg-4">
    <div class="row g-3">
      <div class="col-lg-8 col-xl-9">
        <div class="gi-card p-4" style="min-height: 480px;">
          <div class="d-flex flex-wrap justify-content-between align-items-center border-bottom pb-2 mb-3 gap-2">
            <div>
              <span class="fw-bold fs-5" id="qHeader">Question 1</span>
              <span class="badge bg-light text-dark border ms-2" id="qSection">Technical</span>
              <span class="badge gi-badge-branch ms-1" id="qTypeBadge">MCQ</span>
              <span class="badge bg-secondary ms-1" id="qSourceBadge"></span>
            </div>
            <div class="small">
              <span class="text-success fw-semibold me-2" id="qMarks">+1 Mark</span>
              <span class="text-danger fw-semibold" id="qNegMarks">-0.33 Negative</span>
            </div>
          </div>

          <div id="qStatement" class="fs-6 mb-4" style="white-space: pre-wrap;"></div>
          <div id="qImages" class="mb-3"></div>
          <div id="qInputArea" class="mb-4"></div>

          <div class="d-flex flex-wrap justify-content-between align-items-center pt-3 border-top gap-2">
            <div class="d-flex flex-wrap gap-2">
              <button type="button" class="btn btn-outline-secondary" id="prevBtn">Previous</button>
              <button type="button" class="btn btn-outline-danger" id="clearBtn">Clear Response</button>
              <button type="button" class="btn btn-outline-primary" id="markReviewBtn">Mark for Review &amp; Next</button>
            </div>
            <button type="button" class="btn btn-gi-primary px-4 fw-semibold" id="saveNextBtn">Save &amp; Next</button>
          </div>
        </div>
      </div>

      <div class="col-lg-4 col-xl-3">
        <div class="gi-card p-3">
          <h6 class="fw-bold mb-3">Question Palette</h6>
          <div class="d-flex flex-wrap gap-2 mb-3" id="paletteGrid"></div>
          <hr>
          <div class="row g-2 small text-muted">
            <div class="col-6"><span class="badge st-answered border">&nbsp;</span> Answered</div>
            <div class="col-6"><span class="badge st-visited_unanswered border">&nbsp;</span> Not Answered</div>
            <div class="col-6"><span class="badge st-marked_for_review border">&nbsp;</span> Marked</div>
            <div class="col-6"><span class="badge st-answered_and_marked border">&nbsp;</span> Ans &amp; Marked</div>
            <div class="col-12"><span class="badge st-not_visited border">&nbsp;</span> Not Visited</div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Submit Confirmation Modal -->
  <div class="modal fade" id="submitModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Confirm Test Submission</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p class="mb-2">Review your question summary before submitting:</p>
          <ul class="list-group list-group-flush small mb-0" id="submitSummaryList"></ul>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Resume Test</button>
          <form method="post" action="{{ url_for('assessments.submit_exam', attempt_id=attempt.id) }}" id="finalSubmitForm">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="btn btn-danger fw-semibold">Confirm &amp; Submit</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script id="initial-exam-state" type="application/json">{{ initial_state | tojson }}</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/exam.js') }}"></script>
</body>
</html>
